name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # PS5 Payload SDK release used for the build (https://github.com/ps5-payload-dev/sdk/releases)
  SDK_VERSION: v0.44

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 xxd unzip libsqlite3-dev

      - name: Cache PS5 Payload SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/ps5-payload-sdk
          key: ps5-payload-sdk-${{ env.SDK_VERSION }}

      - name: Install PS5 Payload SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o sdk.zip "https://github.com/ps5-payload-dev/sdk/releases/download/${SDK_VERSION}/ps5-payload-sdk.zip"
          unzip -q sdk.zip -d "$HOME"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^#define VERSION "PS4Mount \(.*\)"$/\1/p' src/main.c)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION \"${version}\" in src/main.c"
            exit 1
          fi

      - name: Phase 2 safety guard and host tests
        run: |
          grep -q '^#define ENABLE_EXPERIMENTAL_REGISTRATION 0$' src/main.c
          grep -Fq '[safe][db] direct SQLite registration BLOCKED' src/db.c
          bash tests/run_host_tests.sh

      - name: Build
        run: PS5_PAYLOAD_SDK="$HOME/ps5-payload-sdk" bash build.sh

      - name: Checksum
        run: cd build && sha256sum ps4mount.elf > ps4mount.elf.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ps4mount
          path: |
            build/ps4mount.elf
            build/ps4mount.elf.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ps4mount

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ps4mount.elf ps4mount.elf.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "PS4Mount ${GITHUB_REF_NAME#v}" \
            --generate-notes
