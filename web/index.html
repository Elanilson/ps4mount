<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4Mount</title>
<style>
:root{--bg:#0e1116;--panel:#171b22;--line:#262c36;--fg:#e8eaed;--muted:#97a0ab;--accent:#3d7bfd;--ok:#2f9e57;--warn:#c98b1f;--bad:#c2453b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(14,17,22,.95);border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}
h1 small{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search]{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;min-width:200px}
button{font:inherit;color:var(--fg);background:#262d38;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover,button:focus{border-color:var(--accent);outline:none}
button.primary{background:var(--accent);border-color:var(--accent)}
button.danger{background:#3a1f1d;border-color:#5c2c28}
button:disabled{opacity:.45;cursor:default}
main{padding:20px;max-width:1400px;margin:0 auto}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;color:var(--muted)}
.summary span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.art{aspect-ratio:1/1;background:#0b0d11 center/cover no-repeat;position:relative}
.badge{position:absolute;left:10px;top:10px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#000a}
.b-ready{background:var(--ok)}.b-running{background:var(--accent)}.b-removed{background:#555}.b-internal{background:var(--warn)}.b-pending{background:var(--warn)}.b-duplicate{background:#555}
.info{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:600;font-size:16px}
.meta{color:var(--muted);font-size:13px;word-break:break-all}
/* Progress is local to the card being processed, not a permanent global status. */
.card-progress{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.card-progress span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.card-progress progress{display:block;width:100%;height:9px;accent-color:var(--accent)}
[hidden]{display:none!important}
.actions{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.warn{color:#f0c060;font-size:13px;background:#3a2e12;border:1px solid #5c4818;border-radius:8px;padding:6px 8px;margin-top:4px}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;max-width:min(900px,95vw);width:900px}
dialog::backdrop{background:#000a}
pre{white-space:pre-wrap;font-size:12px;max-height:60vh;overflow:auto;background:#0b0d11;padding:12px;border-radius:8px}
form.settings{display:flex;flex-direction:column;gap:14px}
form.settings label{display:flex;flex-direction:column;gap:6px}
form.settings label.check{flex-direction:row;align-items:center;gap:10px}
form.settings textarea,form.settings input[type=number]{background:#0b0d11;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
form.settings textarea{min-height:90px;resize:vertical;font-family:ui-monospace,Consolas,monospace}
form.settings .hint{color:var(--muted);font-size:13px}
form.settings .row{display:flex;gap:8px;justify-content:flex-end}
#progress-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:18px}
#progress-wrap progress{display:block;width:100%;height:15px;accent-color:var(--accent);margin-top:6px}
#progress-detail{color:var(--muted);font-size:13px;margin-top:3px}
.b-inactive{background:#555}
#toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:none;max-width:420px}
</style>
</head>
<body>
<header>
  <h1>PS4Mount <small id="ver"></small></h1>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar nome ou CUSA">
    <button id="rescan" class="primary">Buscar jogos no USB</button>
    <button id="settingsbtn">Configurações</button>
    <button id="logbtn">Log</button>
    <button id="stop" class="danger">Encerrar ELF</button>
  </div>
</header>
<main>
  <section id="progress-wrap" aria-live="polite" hidden><strong id="progress-title"></strong>
    <progress id="progress-bar" max="1"></progress>
    <div id="progress-detail"></div>
  </section>
  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nenhum jogo organizado encontrado. Clique em Buscar jogos para localizar PKGs nas subpastas.</div>
</main>
<dialog id="setdlg"><h3>Configurações</h3>
<form class="settings" id="setform">
  <label>Pastas a pesquisar (uma por linha, relativas ao HD)
    <textarea id="s-paths" spellcheck="false"></textarea>
    <span class="hint">/ é a raiz. Os PKGs encontrados podem ser reorganizados no próprio HD na pasta ps4/.</span>
  </label>
  <label class="check"><input type="checkbox" id="s-batch"> Preparar metadados de DLCs em grupos</label>
  <label>DLCs por grupo de preparação
    <input type="number" id="s-size" min="1" max="50">
    <span class="hint">Não ativa jogos adicionais; somente divide o preparo das DLCs do jogo selecionado.</span>
  </label>
  <p class="hint">Jogo base, atualizacao e DLCs validos do USB sao sempre incluidos ao montar.</p>
  <div class="row"><button type="button" id="s-cancel">Cancelar</button><button class="primary" type="submit">Salvar</button></div>
</form></dialog>
<dialog id="logdlg"><h3>Log</h3><pre id="log"></pre><form method="dialog"><button>Fechar</button></form></dialog>
<div id="toast"></div>
<script>
var games = [], busy = {}, lastPhase = '', serverMount = '', serverDlc = '';
var stageLabels = {
  'Preparing selected game': 'Preparando jogo…',
  'Checking selected title': 'Verificando arquivos e registro…',
  'Refreshing metadata and USB links of registered game': 'Atualizando metadados e arquivos USB…',
  'Mounting registered game and update': 'Montando jogo e atualização…',
  'Preparing game, update, and DLC files': 'Preparando arquivos do jogo, atualização e DLCs…',
  'Requesting targeted registration': 'Registrando jogo no PS5…'
};
function stageText(detail, fallback) { return stageLabels[detail] || detail || fallback; }
function sortGames(items) {
  return items.slice().sort(function (a, b) {
    return (a.name || '').localeCompare(b.name || '', 'pt-BR', {sensitivity:'base', numeric:true}) ||
      a.title_id.localeCompare(b.title_id);
  });
}
var labels = {ready: 'Montado', running: 'Em execução', removed: 'Removido anteriormente', internal: 'Instalado internamente', pending: 'Montagem pendente', duplicate: 'Outro HD', inactive: 'Não montado pelo PS4Mount'};

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function gb(n) { return (n / 1073741824).toFixed(n >= 10737418240 ? 0 : 1) + ' GB'; }
function toast(msg) { var t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 4000); }

function api(path, method) {
  return fetch(path, {method: method || 'GET', cache: 'no-store'}).then(function (r) {
    return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; });
  });
}

function render() {
  var q = $('q').value.toLowerCase(), html = '', shown = 0, counts = {};
  games.forEach(function (g) {
    counts[g.state] = (counts[g.state] || 0) + 1;
    if (q && (g.name + ' ' + g.title_id).toLowerCase().indexOf(q) < 0) return;
    shown++;
    var act = '';
    if (['removed', 'inactive', 'pending'].indexOf(g.state) >= 0) act = '<button class="primary" data-a="mount" data-t="' + g.title_id + '">Montar</button>';
    else if (g.state === 'ready') act = '<button class="danger" data-a="unmount" data-t="' + g.title_id + '">Desmontar</button>';
    else if (g.state === 'running') act = '<button disabled>Feche o jogo para desmontar</button>';
    if (g.dlc > 0 && g.state === 'ready')
      act += '<button data-a="register-dlcs" data-t="' + g.title_id + '" title="Teste de revalidacao direcionada do titulo; sem instalacao nativa e sem AppInstallAll. Nao garante registro dos DLCs.">Registrar DLCs (USB)</button>';
    if (g.dlc > 0 && g.state === 'ready')
      act += '<button data-a="install-dlcs" data-t="' + g.title_id + '" title="Instalacao nativa REAL; copia os PKGs para o SSD. Nao usa AppInstallAll.">Instalar DLCs (NATIVO / SSD)</button>';
    if (g.title_id === 'CUSA03842') {
      act += '<button data-a="test-dlc-usb" data-t="' + g.title_id + '" title="TESTE de apenas BH70000000DLC001: monta um link para o USB por cima da pasta no SSD, sem apagar o original.">Testar 1 DLC no USB</button>';
      act += '<button data-a="restore-dlc-native" data-t="' + g.title_id + '" title="Desfaz a montagem temporaria para exibir o DLC original do SSD.">Restaurar DLC no SSD</button>';
    }
    if (g.dlc > 0)
      act += '<button data-a="diagnose-db" data-t="' + g.title_id + '" title="Consultar SOMENTE LEITURA os registros do addcont.db deste jogo, sem instalacao nem alteracoes">Diagnosticar DB</button>';
    var job = busy[g.title_id];
    if (job) act = '<button disabled>' + (job.action === 'unmount' ? 'Desmontando…' : job.action === 'register-dlcs' ? 'Revalidando DLCs no USB…' : job.action === 'install-dlcs' ? 'Instalando no SSD…' : 'Montando…') + '</button>';
    html += '<div class="card"><div class="art" style="background-image:url(/icon/' + g.title_id + ')">' +
      '<span class="badge b-' + g.state + '">' + esc(labels[g.state] || g.state) + '</span></div>' +
      '<div class="info"><div class="name">' + esc(g.name) + '</div>' +
      '<div class="meta">' + g.title_id + ' · v' + esc(g.version) + (g.has_patch ? ' (atualizado)' : '') +
        (g.dlc ? ' · ' + g.dlc + ' DLC(s)' : '') + ' · ' + gb(g.size) + '</div>' +
      '<div class="meta">' + esc(g.source) + (g.mount ? ' · montagem ' + g.mount : '') + '</div>' +
      (g.update_issue ? '<div class="warn">' + esc(g.update_issue) + '</div>' : '') + '</div>' +
      (job ? '<div class="card-progress" role="status" aria-live="polite">' +
        '<span>' + esc(job.detail) + '</span><progress aria-label="Processamento de ' + esc(g.name) + '"' + (job.percent >= 0 ? ' value="' + job.percent + '" max="100"' : '') + '></progress></div>' : '') +
      '<div class="actions">' + act + '</div></div>';
  });
  $('grid').innerHTML = html;
  $('empty').hidden = games.length > 0;
  var s = '<span>' + games.length + ' jogo(s)</span>';
  for (var k in counts) s += '<span>' + esc(labels[k] || k) + ': ' + counts[k] + '</span>';
  $('summary').innerHTML = s;
}

function load() {
  api('/api/games').then(function (j) { games = sortGames(j.games); $('ver').textContent = j.version; render(); })
    .catch(function (e) { toast('Não foi possível ler os jogos: ' + e.message); });
}

$('grid').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-a]');
  if (!b) return;
  var tid = b.getAttribute('data-t'), a = b.getAttribute('data-a');
  if (busy[tid]) return;
  if (a === 'diagnose-db') {
    api('/api/diagnose-db?title_id=' + tid, 'POST').then(function (result) {
      toast(result.message || 'Diagnostico do banco concluido');
      $('logbtn').click();
    }).catch(function (err) { toast('Falha ao consultar addcont.db: ' + err.message); });
    return;
  }
  if (a === 'test-dlc-usb' || a === 'restore-dlc-native') {
    var intro = a === 'test-dlc-usb' ? 'TESTE: mascarar TEMPORARIAMENTE o DLC BH70000000DLC001 instalado no SSD por um pacote identico no HD USB? Nao libera espaco, nao cria registro e pode falhar no PS5.' : 'Restaurar a visibilidade do DLC original BH70000000DLC001 no SSD? Feche Resident Evil 7 antes.';
    if (!confirm(intro)) return;
    api('/api/' + a + '?title_id=' + tid, 'POST').then(function (j) {
      toast(j.message); $('logbtn').click(); load();
    }).catch(function (err) { toast('Falha no teste: ' + err.message); $('logbtn').click(); });
    return;
  }
  if (a === 'install-dlcs' && !confirm('Instalar NATIVAMENTE todos os DLCs de ' + tid + '? O PS5 COPIA os pacotes para o SSD e ocupa espaco; desmontar NAO remove esses arquivos.')) return;
  if (a === 'register-dlcs' && !confirm('Revalidar os registros dos DLCs de ' + tid + '? A chamada apenas revalida o titulo via AppInstallTitleDir e NAO tem eficacia comprovada para registrar DLCs. Nao executa instalacao nativa nem AppInstallAll.')) return;
  if (a === 'unmount' && !confirm('Desmontar ' + tid + '? O registro no PS5 será mantido; a restauração automática deste jogo será desativada.')) return;
  // Mount is a single click. Unmount retains its safety confirmation.
  busy[tid] = {action: a, percent:-1, detail: a === 'mount' ? 'Solicitando montagem…' : a === 'register-dlcs' ? 'Solicitando revalidacao USB…' : a === 'install-dlcs' ? 'Solicitando instalacao nativa…' : 'Desmontando jogo…'};
  render();
  api('/api/' + a + '?title_id=' + tid, 'POST').then(function () {
    if (a === 'mount' || a === 'register-dlcs' || a === 'install-dlcs') {
      // POST means queued, NOT completed: retain card progress until /api/progress says so.
      if (busy[tid] && (busy[tid].detail === 'Solicitando montagem…' || busy[tid].detail === 'Solicitando revalidacao USB…' || busy[tid].detail === 'Solicitando instalacao nativa…')) {
        busy[tid].detail = a === 'register-dlcs' ? 'Revalidacao USB na fila…' : a === 'install-dlcs' ? 'Instalacao nativa na fila…' : 'Montagem na fila…';
        render();
      }
      loadProgress();
    } else {
      delete busy[tid];
      load();
    }
  }).catch(function (err) {
    delete busy[tid];
    toast('Erro ao ' + (a === 'mount' ? 'montar' : a === 'register-dlcs' ? 'revalidar DLCs de' : a === 'install-dlcs' ? 'instalar DLCs de' : 'desmontar') + ' ' + tid + ': ' + err.message);
    load();
  });
});
$('q').addEventListener('input', render);
$('rescan').onclick = function () { if (!confirm('Buscar PKGs em subpastas e organizá-los dentro do mesmo HD? Nenhum jogo será registrado nessa etapa.')) return; $('progress-wrap').hidden = false; $('progress-title').textContent = 'Solicitando busca no USB…'; $('progress-bar').removeAttribute('value'); $('progress-detail').textContent = 'Aguardando início da busca'; api('/api/rescan', 'POST').then(function () { loadProgress(); }).catch(function (e) { toast('Erro: ' + e.message); loadProgress(); }); };
$('logbtn').onclick = function () { api('/api/log').then(function (j) { $('log').textContent = j.log; $('logdlg').showModal(); }); };
$('settingsbtn').onclick = function () {
  api('/api/config').then(function (c) {
    $('s-paths').value = c.paths.join('\n');
    $('s-batch').checked = c.batch;
    $('s-size').value = c.batch_size;
    $('s-size').disabled = !c.batch;
    $('setdlg').showModal();
  }).catch(function (e) { toast('Could not read the settings: ' + e.message); });
};
$('s-batch').onchange = function () { $('s-size').disabled = !this.checked; };
$('s-cancel').onclick = function () { $('setdlg').close(); };
$('setform').onsubmit = function (e) {
  e.preventDefault();
  var body = 'batch=' + ($('s-batch').checked ? 1 : 0) + '&batch_size=' + encodeURIComponent($('s-size').value) +
    '&dlc=1&paths=' + encodeURIComponent($('s-paths').value);
  fetch('/api/config', {method: 'POST', cache: 'no-store', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: body})
    .then(function (r) { return r.json(); })
    .then(function (j) { toast(j.message || j.error); if (j.ok) $('setdlg').close(); })
    .catch(function (err) { toast('Erro: ' + err.message); });
};
$('stop').onclick = function () {
  if (!confirm('Encerrar o PS4Mount? Os jogos podem ficar indisponíveis até executar o ELF novamente.')) return;
  api('/api/stop', 'POST').then(function (j) { toast(j.message); });
};
function loadProgress() {
  api('/api/progress').then(function (p) {
    var active = ['restoring','searching','activating','queued','dlc_register_queued','registering_dlcs','dlc_queued','installing_dlcs'].indexOf(p.phase) >= 0;
    $('rescan').disabled = active;
    // Only scanning/restoring uses the global progress. Mount/unmount uses its game card.
    var globalProgress = p.phase === 'searching' || p.phase === 'restoring';
    $('progress-wrap').hidden = !globalProgress;
    if (globalProgress) {
      $('progress-bar').max = Math.max(p.total, 1);
      if (p.phase === 'searching') {
        $('progress-bar').removeAttribute('value'); // total not known
        $('progress-title').textContent = 'Buscando jogos no USB… · ' + p.scan_folders + ' pastas · ' + p.scan_pkgs + ' PKGs examinados · ' + p.scan_organized + ' organizados';
        $('progress-detail').textContent = p.scan_path || p.detail || 'Iniciando busca';
      } else {
        $('progress-bar').value = p.done;
        $('progress-title').textContent = 'Restaurando jogos ativos — ' + p.done + '/' + p.total;
        $('progress-detail').textContent = (p.current ? p.current + ' · ' : '') + p.detail;
      }
    }
    var installingDlc = (['dlc_register_queued','registering_dlcs','dlc_queued','installing_dlcs'].indexOf(p.phase) >= 0) && p.current;
    if (installingDlc) {
      serverDlc = p.current;
      var dlcDetail = p.phase === 'dlc_register_queued' ? 'Aguardando revalidacao dos DLCs…' : p.phase === 'dlc_queued' ? 'Aguardando instalacao nativa…' :
        ((p.done || 0) + '/' + (p.total || '?') + ' DLC(s) processados · ' + (p.detail || (p.phase === 'installing_dlcs' ? 'Instalando no SSD…' : 'Revalidando DLC…')));
      var current = busy[serverDlc], actionDlc = (p.phase === 'dlc_queued' || p.phase === 'installing_dlcs') ? 'install-dlcs' : 'register-dlcs';
      if (!current || current.action !== actionDlc || current.detail !== dlcDetail || current.percent !== p.dlc_percent) {
        busy[serverDlc] = {action:actionDlc, detail:dlcDetail, percent:p.dlc_percent};
        render();
      }
    } else if (serverDlc && (p.phase === 'dlc_complete' || p.phase === 'dlc_error')) {
      delete busy[serverDlc];
      if (p.phase === 'dlc_error') toast('Registro dos DLCs nao confirmado: consulte o log.');
      serverDlc = '';
      load(); render();
    }
    var mounting = (p.phase === 'queued' || p.phase === 'activating') && p.current;
    var changed = false;
    if (mounting) {
      // A reload of the panel can reconnect to an ongoing game operation.
      if (serverMount && serverMount !== p.current && busy[serverMount] && busy[serverMount].action === 'mount') {
        delete busy[serverMount]; changed = true;
      }
      serverMount = p.current;
      var detail = stageText(p.detail, 'Montando jogo…');
      if (!busy[p.current] || busy[p.current].detail !== detail) {
        busy[p.current] = {action:'mount', detail:detail}; changed = true;
      }
    } else if (['complete','error','idle'].indexOf(p.phase) >= 0) {
      // A very fast mount may finish before the first poll: use p.current too.
      var finishedTitle = serverMount || (p.phase !== 'idle' ? p.current : '');
      if (finishedTitle && busy[finishedTitle] && busy[finishedTitle].action === 'mount') {
        delete busy[finishedTitle]; changed = true;
        if (p.phase === 'error') toast('Falha ao montar ' + finishedTitle + '. Consulte o log.');
        load();
      }
      serverMount = '';
    }
    if (lastPhase && ['restoring','searching'].indexOf(lastPhase) >= 0 && ['complete','error'].indexOf(p.phase) >= 0) load();
    lastPhase = p.phase;
    if (changed) render();
  }).catch(function () {
    if (!$('progress-wrap').hidden) $('progress-detail').textContent = 'Painel desconectado; confira o log ao reconectar.';
  });
}
load();
loadProgress();
setInterval(loadProgress, 1500);
setInterval(load, 30000);
</script>
</body>
</html>
